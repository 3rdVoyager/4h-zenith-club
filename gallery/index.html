<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4-H Zenith Club | Gallery</title>
    <link rel="stylesheet" href="/css/main.css" />
    <script src="/js/nav.js" defer></script>
    <script src="/js/gallery.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main class="page-main">
      <section class="hero" id="hero">
        <h1>Gallery</h1>
        <p>Photos from Zenith club activities, booths, banners, and record books.</p>
      </section>

      <section class="content-section" id="club-photos">
        <h2>Club Photos</h2>
        <figure class="gallery" data-autoplay="5000">
          <div class="gallery__viewport">
            <ul class="gallery__track">
              <li class="gallery__slide is-active">
                <img
                  src="/assets/images/gallery/2026 Booth.jpg"
                  alt="2026 club booth at the Montgomery County Fair"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2026 Banner.jpg"
                  alt="2026 club banner at the Montgomery County Fair"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2026 Historian Book for 2025.jpg"
                  alt="2026 historian book covering the 2025 club year"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2025 Booth.jpg"
                  alt="2025 club booth at the Montgomery County Fair"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2025 Banner.jpg"
                  alt="2025 club banner at the Montgomery County Fair"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2025 Historian Book for 2024.jpg"
                  alt="2025 historian book covering the 2024 club year"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2024 Booth.JPG"
                  alt="2024 club booth at the Montgomery County Fair"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2024 Historian Book for 2023.JPG"
                  alt="2024 historian book covering the 2023 club year"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2023 Booth.JPG"
                  alt="2023 club booth at the Montgomery County Fair"
                />
              </li>
              <li class="gallery__slide">
                <img
                  src="/assets/images/gallery/2023 Historian Book for 2022.JPG"
                  alt="2023 historian book covering the 2022 club year"
                />
              </li>
            </ul>
          </div>
          <ul class="gallery-thumbnails" aria-label="Club photos"></ul>
        </figure>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
