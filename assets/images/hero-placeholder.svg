<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800" role="img" aria-label="Hero image placeholder">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a6b47"/>
      <stop offset="100%" stop-color="#143401"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="800" fill="url(#sky)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>
  <text
    x="960"
    y="400"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#f2efe4"
    fill-opacity="0.35"
    font-family="sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="0.15em"
  >HERO IMAGE PLACEHOLDER</text>
</svg>
